[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-risk-fwa-detection"
version = "1.0.0"
description = "Explainable healthcare claims risk and FWA detection with Python, SQL and machine learning"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scikit-learn==1.5.2",
  "scipy==1.15.3",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "joblib==1.4.2",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.40.2", "plotly==5.24.1"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[project.scripts]
claims-risk = "claims_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


